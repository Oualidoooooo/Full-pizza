<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1512">
<title>Full Pizza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout : banc de démo à deux écrans — le téléphone du client à gauche, la tablette du comptoir à droite, reliés par les mêmes données. Un seul écran à la fois sur mobile. Identité : nappe à carreaux rouge et blanc, étiquettes de prix jaunes penchées, pizzas dessinées d'après leurs vrais ingrédients. */
:root{
  --tomato:#D62828; --tomato-d:#A81E1E; --tomato-soft:#FBE3DF;
  --char:#1B1512; --char-2:#2B221E; --char-3:#3B302B;
  --dough:#FFF8EC; --dough-2:#F5EAD8; --paper:#FFFFFF; --table:#E8DCCB;
  --cheese:#F7B32B; --cheese-soft:#FFF1CC;
  --basil:#2F8F4E; --basil-soft:#E1F2E6;
  --ink:#1B1512; --muted:#76665B; --line:#E8DCC9;
  --f-display:'Anton', Impact, 'Arial Narrow Bold', sans-serif;
  --f-body:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-cond:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{background:var(--table);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Banc de démo ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.demo-bar{background:var(--char);color:var(--dough);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.demo-title{display:flex;align-items:center;gap:10px;margin-right:auto}
.demo-title small{font-family:var(--f-cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#CDBBA6}
.demo-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dchip{font-family:var(--f-cond);font-weight:600;font-size:14px;letter-spacing:.02em;padding:7px 12px;border-radius:8px;background:var(--char-3);color:var(--dough);min-height:36px}
.dchip.on{background:var(--cheese);color:var(--char)}
.dchip.warn{background:var(--tomato);color:#fff}
.checker{height:10px;background:conic-gradient(var(--tomato) 25%,var(--dough) 0 50%,var(--tomato) 0 75%,var(--dough) 0) 0 0/10px 10px}
.stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
.view-tabs{display:flex;gap:6px}
@media (min-width:1100px){.stage{grid-template-columns:400px minmax(0,1fr)}.view-tabs{display:none}}
@media (max-width:1099px){.stage[data-view="client"] .col-patron{display:none}.stage[data-view="patron"] .col-client{display:none}}
.col{min-width:0;display:flex;flex-direction:column;gap:8px}
.col-label{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.col-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tomato)}
.phone{position:relative;height:min(820px,calc(100dvh - 140px));min-height:600px;width:100%;max-width:400px;margin-inline:auto;background:var(--dough);border:8px solid var(--char);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 50px -24px rgba(27,21,18,.55)}
.tablet{position:relative;height:min(820px,calc(100dvh - 140px));min-height:600px;background:#F7F2EA;border:10px solid var(--char);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 50px -24px rgba(27,21,18,.45)}
@media (max-width:520px){.phone,.tablet{border-width:0;border-radius:14px;height:calc(100dvh - 150px)}}

/* ---------- Marque ---------- */
.mark{display:flex;align-items:center;gap:8px;min-width:0}
.mark svg{flex:none}
.mark-name{font-family:var(--f-display);font-size:23px;line-height:1;letter-spacing:.02em;transform:skewX(-7deg);white-space:nowrap}
.mark-name span{color:var(--tomato)}
.mark-sm .mark-name{font-size:19px}

/* ---------- Appli client ---------- */
.c-head{background:var(--char);color:var(--dough);padding:12px 14px 10px;display:flex;align-items:center;gap:10px}
.c-head .mark-name span{color:#FF5A43}
.c-status{display:flex;align-items:center;gap:6px;margin-top:4px;font-family:var(--f-cond);font-size:14px;color:#D9C8B3}
.badge{display:inline-block;font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.07em;padding:2px 7px;border-radius:4px;text-transform:uppercase;line-height:1.35}
.b-open{background:var(--basil);color:#fff}.b-closed{background:var(--tomato);color:#fff}.b-pause{background:var(--cheese);color:var(--char)}
.loy-btn{margin-left:auto;flex:none;display:flex;align-items:center;gap:5px;background:var(--cheese);color:var(--char);font-family:var(--f-cond);font-weight:700;font-size:16px;padding:0 12px;min-height:40px;border-radius:999px}
.loy-btn svg{width:16px;height:16px}
.c-banner{background:#4A3F39;color:#fff;font-family:var(--f-cond);font-size:15px;padding:8px 14px;display:flex;gap:8px;align-items:center}
.c-banner.pause{background:var(--cheese);color:var(--char)}
.c-scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding-bottom:140px;scroll-behavior:smooth}
.c-scroll.no-nav{padding-bottom:24px}
.pad{padding:14px}
.mode-row{padding:14px 14px 4px;display:grid;gap:8px}
.seg{display:flex;background:var(--dough-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--muted)}
.seg button svg{width:19px;height:19px}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(27,21,18,.15)}
.mode-sub{font-size:14px;color:var(--muted)}
.hero{margin:10px 14px 0;background:var(--tomato);color:#fff;border-radius:18px;display:grid;grid-template-columns:minmax(0,1fr) 120px;overflow:hidden;position:relative}
.hero-txt{padding:16px 0 16px 16px;display:grid;gap:8px;align-content:start}
.eyebrow{font-family:var(--f-cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.hero h2{font-family:var(--f-display);font-size:32px;line-height:.95;text-transform:uppercase;transform:skewX(-6deg);font-weight:400}
.hero p{font-size:14px;opacity:.95}
.hero-art{position:relative}
.hero-art svg{position:absolute;right:-46px;top:50%;transform:translateY(-50%) rotate(-12deg);width:170px;height:170px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.hero-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.tag{display:inline-block;background:var(--cheese);color:var(--char);font-family:var(--f-cond);font-weight:700;font-size:17px;padding:1px 8px;border-radius:3px;transform:rotate(-3deg);box-shadow:2px 2px 0 var(--char);white-space:nowrap}
.tag-lg{font-size:24px;padding:2px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-family:var(--f-cond);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.btn svg{width:20px;height:20px}
.btn-red{background:var(--tomato);color:#fff}.btn-red:hover:not(:disabled){background:var(--tomato-d)}
.btn-dark{background:var(--char);color:#fff}
.btn-cheese{background:var(--cheese);color:var(--char)}
.btn-light{background:var(--paper);color:var(--char)}
.btn-ghost{border:1.5px solid currentColor}
.btn-sm{min-height:40px;font-size:15px;padding:0 12px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.45}
.offer{margin:12px 14px 0;background:var(--cheese);color:var(--char);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:600}
.offer svg{flex:none}
.last{margin:12px 14px 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}
.last div{flex:1;min-width:0}
.last strong{display:block;font-family:var(--f-cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.last span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{margin:14px 14px 0;display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{color:var(--muted);flex:none;width:20px}
.search input{flex:1;min-width:0;border:0;background:none;min-height:46px;outline:none}
.search:focus-within{border-color:var(--char)}
.filters{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.chip{min-height:38px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--char);border-color:var(--char);color:#fff}
.chip.removed{background:var(--dough-2);color:var(--muted);text-decoration:line-through;border-style:dashed}
.chip small{font-family:var(--f-cond);font-weight:700;color:var(--tomato)}
.chip.on small{color:var(--cheese)}
.cats{position:sticky;top:0;z-index:4;background:var(--dough);display:flex;gap:6px;overflow-x:auto;padding:12px 14px 10px;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:6px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;white-space:nowrap;font-family:var(--f-cond);font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;padding:6px 12px;border-radius:8px;background:var(--dough-2);min-height:36px}
.cats button.cat-fav{background:var(--tomato-soft);color:var(--tomato-d)}
.sec{padding:16px 14px 2px;scroll-margin-top:60px;display:grid;gap:10px}
.sec h2{font-family:var(--f-display);font-weight:400;font-size:25px;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left;line-height:1}
.sec-note{font-size:13px;color:var(--muted);margin-top:-4px}
.pcard{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative}
.pcard.is-out{opacity:.62}
.pvis{width:88px;height:88px;border-radius:12px;background:var(--dough-2);display:grid;place-items:center;position:relative;overflow:hidden}
.pvis svg{width:80px;height:80px}
.out-badge{position:absolute;left:4px;right:4px;top:50%;transform:translateY(-50%) rotate(-8deg);background:var(--tomato);color:#fff;font-family:var(--f-cond);font-weight:700;letter-spacing:.08em;font-size:13px;text-align:center;padding:2px 0}
.pbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.prow{display:flex;align-items:flex-start;gap:6px}
.prow h3{flex:1;font-family:var(--f-cond);font-weight:700;font-size:19px;line-height:1.1;cursor:pointer}
.hot{font-family:var(--f-cond);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tomato-d);background:var(--tomato-soft);padding:1px 6px;border-radius:4px;display:inline-block}
.fav{width:36px;height:36px;margin:-6px -6px 0 0;display:grid;place-items:center;color:var(--muted);flex:none}
.fav svg path{fill:none;stroke:currentColor;stroke-width:2}
.fav.on{color:var(--tomato)}.fav.on svg path{fill:var(--tomato)}
.pdesc{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pfoot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.link-sm{font-size:13px;text-decoration:underline;color:var(--muted);min-height:30px}
.plus{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--tomato);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;box-shadow:0 3px 0 var(--tomato-d)}
.plus:disabled{background:#BDB0A5;box-shadow:none}
.tbc{font-family:var(--f-cond);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7A5200;border:1px dashed #D9A033;background:#FFF6DD;padding:0 5px;border-radius:4px;white-space:nowrap}
.hide-tbc .tbc{display:none}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty strong{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink);text-transform:uppercase}
.cart-btn{position:absolute;left:12px;right:12px;bottom:76px;z-index:6;background:var(--char);color:#fff;border-radius:14px;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;box-shadow:0 10px 24px -8px rgba(27,21,18,.6);font-family:var(--f-cond);font-weight:700;font-size:18px;letter-spacing:.02em}
.cart-btn .count{background:var(--tomato);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:16px;padding:0 6px}
.cart-btn .tot{margin-left:auto;color:var(--cheese)}
.c-nav{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 4px 6px}
.c-nav button{display:grid;justify-items:center;gap:2px;font-family:var(--f-cond);font-weight:600;font-size:13px;color:var(--muted);min-height:54px;align-content:center;border-radius:10px}
.c-nav button svg{width:23px;height:23px}
.c-nav button.on{color:var(--tomato)}
.c-nav button.on svg{stroke-width:2.4}

/* Panneaux qui montent du bas */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(27,21,18,.5)}
.sheet{background:var(--dough);border-radius:22px 22px 0 0;max-height:94%;display:flex;flex-direction:column;min-height:0}
.sheet.anim{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-top h3{flex:1;font-family:var(--f-display);font-weight:400;font-size:22px;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--dough-2);flex:none}
.sheet-body{overflow-y:auto;padding:14px;display:grid;gap:18px;min-height:0}
.sheet-foot{padding:12px 14px 14px;border-top:1px solid var(--line);background:var(--paper);display:grid;gap:8px}
.miss{font-size:13px;color:var(--tomato-d);font-weight:600;text-align:center}
.comp-vis{display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,#F3E3C8 0 55%,transparent 56%),var(--dough-2);border-radius:18px;padding:14px;position:relative}
.comp-vis svg{width:190px;height:190px}
.comp-head{display:grid;gap:4px}
.comp-head h2{font-family:var(--f-display);font-weight:400;font-size:30px;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left;line-height:1}
.comp-head .ings{color:var(--muted)}
.grp{display:grid;gap:10px}
.grp-h{display:flex;align-items:center;gap:8px}
.grp-h h4{font-family:var(--f-cond);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.03em;flex:1}
.pill{font-family:var(--f-cond);font-weight:700;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--cheese-soft);color:#7A5200}
.pill.ok{background:var(--basil-soft);color:var(--basil)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.size-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.size-btns button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px;min-height:64px;display:grid;gap:2px;justify-items:start}
.size-btns button.on{border-color:var(--char);box-shadow:inset 0 0 0 1px var(--char)}
.size-btns b{font-family:var(--f-cond);font-size:18px}
.size-btns span{font-size:13px;color:var(--muted)}
.toggle-row{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.toggle-row div{flex:1}
.toggle-row small{display:block;color:var(--muted);font-size:13px}
.switch{width:52px;height:30px;border-radius:999px;background:#CFC2B4;position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--basil)}.switch.on::after{transform:translateX(22px)}
.sel{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:0 12px}
.sup-list{display:grid;gap:6px}
.sup{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.sup span{flex:1}
.sup em{font-style:normal;font-family:var(--f-cond);font-weight:700;color:var(--tomato-d)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--dough-2);font-size:22px;line-height:1;display:grid;place-items:center;font-weight:600}
.stepper output{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qty-row{display:flex;align-items:center;justify-content:center;gap:12px}
.cline{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px}
.cline .pvis{width:56px;height:56px;border-radius:10px}.cline .pvis svg{width:50px;height:50px}
.cline h4{font-family:var(--f-cond);font-size:17px;font-weight:700;line-height:1.15}
.cline ul{list-style:none;margin:2px 0 0;padding:0;font-size:13px;color:var(--muted)}
.cline .right{display:grid;justify-items:end;gap:6px}
.cline .right b{font-family:var(--f-cond);font-size:17px}
.l-sans{color:var(--tomato-d);font-weight:600}.l-sup{color:var(--basil);font-weight:600}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sugg button{flex:none;width:118px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:4px;justify-items:center;text-align:center;font-size:13px;font-weight:600}
.sugg .pvis{width:64px;height:64px}.sugg .pvis svg{width:56px;height:56px}
.sugg em{font-style:normal;font-family:var(--f-cond);color:var(--tomato-d);font-weight:700}
textarea.note{width:100%;min-height:64px;border-radius:12px;border:1.5px solid var(--line);padding:10px 12px;background:var(--paper);resize:vertical}
.reward{background:var(--char);color:#fff;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}
.reward div{flex:1}
.reward small{display:block;color:#D9C8B3}
.totals{display:grid;gap:4px;font-size:15px}
.totals div{display:flex;justify-content:space-between;gap:8px}
.totals .grand{font-family:var(--f-cond);font-weight:700;font-size:22px;padding-top:6px;border-top:1px dashed var(--line)}
.progress{height:8px;border-radius:99px;background:var(--dough-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--cheese)}
.hint{font-size:13px;color:var(--muted)}
.warn-box{background:var(--tomato-soft);color:var(--tomato-d);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.ok-box{background:var(--basil-soft);color:#1E6A39;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}

/* Formulaires */
.screen-top{position:sticky;top:0;z-index:5;background:var(--dough);display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.screen-top h2{font-family:var(--f-display);font-weight:400;font-size:24px;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left}
.form{display:grid;gap:18px;padding:14px}
.fsec{display:grid;gap:10px}
.fsec>h3{font-family:var(--f-cond);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:0 12px;width:100%}
.field textarea{padding:10px 12px;min-height:60px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--char);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio-list{display:grid;gap:6px}
.radio{display:flex;gap:10px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px;width:100%}
.radio.on{border-color:var(--char);box-shadow:inset 0 0 0 1px var(--char)}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid #B9AA9C;flex:none}
.radio.on i{border:6px solid var(--char)}
.radio div{flex:1}.radio small{display:block;color:var(--muted);font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--char)}
.legal-links{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
.legal-links button{text-decoration:underline;color:var(--muted)}

/* Stripe de test */
.stripe{background:#fff}
.stripe .sheet-body{gap:12px}
.pay-wallet{min-height:48px;border-radius:10px;background:#000;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;width:100%}
.pay-wallet.g{background:#fff;color:#111;border:1.5px solid #D5D5D5}
.cardbox{border:1.5px solid #D5D5D5;border-radius:10px;overflow:hidden}
.cardbox div{padding:12px;border-bottom:1px solid #E5E5E5;font-variant-numeric:tabular-nums;color:#333}
.cardbox div:last-child{border:0;display:flex;gap:12px}
.test-flag{font-family:var(--f-cond);font-weight:700;background:#FFE7B3;color:#7A5200;padding:2px 8px;border-radius:4px;font-size:13px;justify-self:start}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* Suivi */
.thanks{background:var(--char);color:#fff;padding:18px 14px 70px;display:grid;gap:4px;text-align:center}
.thanks h2{font-family:var(--f-display);font-weight:400;font-size:34px;text-transform:uppercase;transform:skewX(-6deg)}
.thanks p{color:#D9C8B3;font-family:var(--f-cond);font-size:17px}
.ticket{margin:-56px 22px 0;background:var(--cheese);color:var(--char);border-radius:6px;padding:16px;text-align:center;display:grid;gap:2px;position:relative;box-shadow:0 10px 20px -10px rgba(0,0,0,.5);transform:rotate(-1.5deg)}
.ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 5px 0,transparent 5px,var(--cheese) 5.5px) 0 0/10px 10px}
.ticket::before{top:-9px;transform:rotate(180deg)}.ticket::after{bottom:-9px}
.ticket small{font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ticket .big{font-family:var(--f-display);font-size:84px;line-height:1}
.ticket .when{font-family:var(--f-cond);font-weight:700;font-size:19px}
.steps{display:grid;gap:0;padding:6px 0}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step i{width:28px;height:28px;border-radius:50%;border:2px solid #CDBFB1;background:var(--dough);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;z-index:1}
.step.done i{background:var(--basil);border-color:var(--basil);color:#fff}
.step.cur i{background:var(--tomato);border-color:var(--tomato);color:#fff;box-shadow:0 0 0 5px var(--tomato-soft)}
.step b{font-family:var(--f-cond);font-size:18px;text-transform:uppercase;letter-spacing:.03em;display:block;line-height:28px}
.step.todo b{color:#A99A8D}
.step small{color:var(--muted)}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{width:46px;height:46px;display:grid;place-items:center;color:#CDBFB1}
.stars button.on{color:var(--cheese)}
.stars svg{width:34px;height:34px;fill:currentColor;stroke:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card h3{font-family:var(--f-cond);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.stamp-chip{justify-self:center;background:var(--basil);color:#fff;font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:999px}

/* Commandes client */
.olist{display:grid;gap:10px;padding:14px}
.orow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px}
.onum{width:54px;height:54px;border-radius:10px;background:var(--cheese);display:grid;place-items:center;font-family:var(--f-display);font-size:26px}
.orow small{color:var(--muted);display:block}
.st{display:inline-block;font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:var(--dough-2)}
.st-recue{background:var(--cheese-soft);color:#7A5200}.st-prep,.st-four{background:#FFE2CC;color:#8A3A00}.st-prete{background:var(--basil-soft);color:#1E6A39}.st-route{background:#DDE8FA;color:#1F4E9A}.st-done{background:var(--dough-2);color:var(--muted)}.st-remb{background:var(--tomato-soft);color:var(--tomato-d)}

/* Fidélité */
.loy-card{margin:14px;background:var(--char);color:#fff;border-radius:18px;padding:16px;display:grid;gap:12px;position:relative;overflow:hidden}
.loy-card h2{font-family:var(--f-display);font-weight:400;font-size:26px;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left}
.loy-card h2 span{color:var(--cheese)}
.slices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slices div{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed #6E5F55;display:grid;place-items:center}
.slices div.on{border:0;background:var(--cheese)}
.slices svg{width:70%;height:70%}
.loy-card p{color:#E5D6C3}
.qr{display:grid;justify-items:center;gap:6px;padding:14px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.qr svg{width:170px;height:170px}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border:0}
.hist b{font-family:var(--f-cond);font-size:16px}
.plusv{color:var(--basil)}.minusv{color:var(--tomato-d)}

/* Infos */
.hours{width:100%;border-collapse:collapse;font-size:14px}
.hours td{padding:7px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.hours tr.today td{font-weight:700;color:var(--tomato-d)}
.copy-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy-row strong{font-family:var(--f-cond);font-size:22px;letter-spacing:.02em;user-select:all}
.info-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.info-list li{display:flex;gap:8px}
.info-list li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tomato);margin-top:7px;flex:none}

/* Fenêtres */
.modal-wrap{position:absolute;inset:0;z-index:30;background:rgba(27,21,18,.55);display:grid;place-items:center;padding:16px}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:18px;display:grid;gap:14px}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:24px;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left}
.alg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.alg-grid span{font-size:13.5px;padding:6px 8px;border-radius:8px;background:var(--dough);color:#A99A8D}
.alg-grid span.has{background:var(--tomato-soft);color:var(--tomato-d);font-weight:700}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:40;background:var(--char);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 20px -8px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center;animation:up .2s ease-out}
.tablet .toast{bottom:24px}

/* ---------- Espace patron ---------- */
.p-head{background:var(--char);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.p-who{margin-left:auto;display:flex;align-items:center;gap:12px}
.p-who div{text-align:right;line-height:1.2}
.p-who b{font-family:var(--f-cond);font-size:18px;display:block}
.p-who small{color:#CDBBA6;font-size:13px}
.p-clock{font-family:var(--f-cond);font-weight:700;font-size:18px;color:var(--cheese);font-variant-numeric:tabular-nums}
.p-tabs{display:flex;gap:2px;background:var(--char-2);padding:0 10px;overflow-x:auto;scrollbar-width:none}
.p-tabs button{flex:none;color:#CDBBA6;padding:0 14px;min-height:50px;font-family:var(--f-cond);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px}
.p-tabs button.on{color:#fff;border-bottom-color:var(--cheese)}
.p-tabs .cnt{background:var(--tomato);color:#fff;border-radius:999px;font-size:13px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.p-scroll{flex:1;overflow:auto;padding:16px;display:grid;gap:16px;align-content:start}
.sound-bar{display:flex;align-items:center;gap:12px;background:var(--cheese-soft);border:1px solid #F1D48A;border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.sound-bar div{flex:1;min-width:180px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.tile small{font-family:var(--f-cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:13px}
.tile b{font-family:var(--f-display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .seg{background:#EDE3D5}
.toolbar .seg button{padding:0 12px;min-height:44px;white-space:nowrap}
.grow{flex:1}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px;align-items:start}
.ocard{background:var(--paper);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.ocard.new{border-color:var(--tomato);box-shadow:0 0 0 2px var(--tomato)}
.ocard.alert{border-color:var(--tomato)}
.oc-top{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:12px}
.oc-num{width:62px;height:62px;border-radius:12px;background:var(--cheese);display:grid;place-items:center;font-family:var(--f-display);font-size:32px;line-height:1}
.oc-who{min-width:0;display:grid;gap:3px}
.oc-who b{font-family:var(--f-cond);font-size:20px;line-height:1.1}
.oc-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13.5px;color:var(--muted);align-items:center}
.oc-meta svg{width:17px;height:17px;vertical-align:-3px}
.oc-badges{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 10px}
.kb{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--dough-2)}
.kb-new{background:var(--tomato);color:#fff}.kb-time{background:var(--char);color:#fff}.kb-cash{background:var(--cheese);color:var(--char)}.kb-alert{background:var(--tomato-soft);color:var(--tomato-d)}
.oc-items{list-style:none;margin:0;padding:10px 12px;border-top:1px dashed var(--line);display:grid;gap:9px}
.oc-items li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px}
.oc-items .q{font-family:var(--f-display);font-size:20px;line-height:1.1}
.oc-items .nm{font-weight:700;font-size:16.5px;line-height:1.2}
.oc-items .sz{display:inline-block;font-family:var(--f-cond);font-weight:700;background:var(--char);color:#fff;padding:0 6px;border-radius:4px;margin-right:6px;font-size:15px}
.oc-items .det{font-size:14.5px;display:grid}
.oc-items .det .d-bi{font-weight:600}
.oc-items .det .d-sans{color:var(--tomato-d);font-weight:800}
.oc-items .det .d-sup{color:var(--basil);font-weight:800}
.oc-items .det .d-pick{color:var(--ink)}
.oc-items .det .d-free{color:var(--basil);font-weight:700}
.knote{margin:0 12px 10px;background:var(--cheese-soft);border:1.5px dashed var(--cheese);border-radius:10px;padding:8px 10px;font-weight:600}
.addr{margin:0 12px 10px;background:#EEF3FB;border-radius:10px;padding:8px 10px;font-size:14px;display:grid;gap:2px}
.oc-foot{margin-top:auto;padding:10px 12px 12px;border-top:1px solid var(--line);display:grid;gap:8px;background:#FCFAF6}
.oc-sum{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oc-sum b{font-family:var(--f-cond);font-size:20px}
.oc-sub{display:flex;gap:6px;flex-wrap:wrap}
.oc-sub button{font-size:14px;font-weight:600;text-decoration:underline;color:var(--muted);min-height:36px;padding:0 4px}
.oc-sub button.dang{color:var(--tomato-d)}
.inline-row{display:flex;gap:6px;align-items:center}
.inline-row select{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 10px}
.btn-xl{min-height:56px;font-size:20px;width:100%}
.btn-go{background:var(--basil);color:#fff}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;align-items:start}
.bcol{background:#EFE6DA;border-radius:14px;padding:10px;display:grid;gap:8px}
.bcol h3{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:16px;display:flex;justify-content:space-between}
.bcard{background:#fff;border-radius:12px;padding:10px;display:grid;gap:6px;border:1px solid var(--line)}
.bcard .t{display:flex;gap:8px;align-items:center}
.bcard .n{font-family:var(--f-display);font-size:22px;background:var(--cheese);border-radius:8px;width:40px;height:40px;display:grid;place-items:center}
.bcard small{color:var(--muted);font-size:13px}
.late{color:var(--tomato-d);font-weight:700}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.panel>h2{font-family:var(--f-display);font-weight:400;font-size:24px;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left;line-height:1}
.panel>p.hint{margin-top:-6px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog{min-height:44px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.tog.out{background:var(--tomato);border-color:var(--tomato);color:#fff;text-decoration:line-through}
.state-big{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--f-cond);font-size:20px;font-weight:700}
.pin-wrap{flex:1;display:grid;place-items:center;padding:20px;background:var(--char);color:#fff;overflow:auto}
.pin-box{display:grid;gap:18px;justify-items:center;width:100%;max-width:340px}
.pin-box h2{font-family:var(--f-display);font-weight:400;font-size:30px;text-transform:uppercase;transform:skewX(-6deg)}
.pin-box p{color:#CDBBA6;text-align:center;font-size:14px}
.dots{display:flex;gap:16px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid #8C7B6E}
.dots i.on{background:var(--cheese);border-color:var(--cheese)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.keys button{text-align:center;height:76px;border-radius:50%;background:var(--char-3);font-family:var(--f-cond);font-weight:700;font-size:30px;color:#fff}
.keys button:active{background:var(--cheese);color:var(--char)}
.keys .k-del{font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.pin-err{color:#FF8A7A;font-weight:700;min-height:20px}
.demo-codes{font-size:13px;color:#A99788;text-align:center;line-height:1.6}
.demo-codes b{color:var(--cheese)}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:4px;align-items:end;height:180px;padding-top:22px;border-bottom:1.5px solid var(--char);position:relative}
.bars::before{content:"";position:absolute;left:0;right:0;top:calc(22px + (100% - 22px)/2);border-top:1px dashed var(--line)}
.bar{position:relative;background:#D9CBB9;border-radius:4px 4px 0 0;min-height:2px}
.bar.top{background:var(--tomato)}
.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-family:var(--f-cond);font-weight:700;font-size:13px;white-space:nowrap;padding-bottom:2px}
.bar-lbl{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;font-family:var(--f-cond);font-size:12px;color:var(--muted);text-align:center}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14.5px}
.rank li i{font-style:normal;font-family:var(--f-cond);font-weight:700;color:var(--muted)}
.rank .meter{height:6px;border-radius:99px;background:var(--dough-2);grid-column:2/4;overflow:hidden;margin-top:-3px}
.rank .meter b{display:block;height:100%;background:var(--cheese)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;align-items:start}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-family:var(--f-cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--muted);padding:6px 8px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl input[type=number]{width:84px;min-height:38px;border-radius:8px;border:1.5px solid var(--line);padding:0 8px;text-align:right}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.code{font-family:var(--f-cond);font-weight:700;font-size:18px;letter-spacing:.2em;background:var(--dough);padding:2px 8px;border-radius:6px}
.poster{background:var(--tomato);color:#fff;border-radius:12px;padding:22px;display:grid;gap:12px;justify-items:center;text-align:center;max-width:320px;margin-inline:auto;width:100%}
.poster h4{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:.95;text-transform:uppercase;transform:skewX(-6deg)}
.poster .qrw{background:#fff;padding:10px;border-radius:10px}
.poster .qrw svg{width:140px;height:140px;display:block}
.csv{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;border-radius:10px;border:1.5px solid var(--line);padding:10px}
.driver-sum{display:flex;flex-wrap:wrap;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="demo-bar">
    <div class="demo-title">

  if(mode==='livraison'&&st.pausedLiv)return{ok:false,why:`Livraison en pause jusqu'à ${hm(S.pause.until)}. Le retrait reste ouvert.`};return{ok:true}}
const ACTIVE=['recue','prep','four'];
function pizzaCount(o){return o.items.reduce((a,i)=>{const p=prod(i.pid);if(p.kind==='pizza')return a+i.qty;if(p.groups)return a+i.qty*p.groups.filter(g=>g.k==='pizza').length;if(p.id==='calzone'||p.id==='panizza')return a+i.qty;return a},0)}
function waits(){const n=S.orders.filter(o=>o.sday===S.serviceDay&&ACTIVE.includes(o.status)).reduce((a,o)=>a+pizzaCount(o),0);const prep=round5(12+3*n);return{prep,liv:S.forced||round5(prep+15),pizzas:n}}

/* ---------- Prix (recalculés comme le fera le serveur) ---------- */
const priceC=p=>S.prices[p.id]?.p??p.p;
const priceXL=p=>S.prices[p.id]?.xl??p.xl;
const supPrice=n=>(SUPS.find(s=>s[0]===n)||[0,0])[1];
function isOut(p){return S.soldP.includes(p.id)||(p.kind==='pizza'&&p.ing.some(i=>S.soldI.includes(i)))}
const visible=p=>!S.hidden.includes(p.id);
function unitPrice(ci){const p=prod(ci.pid);if(p.kind==='pizza'){let b=ci.size==='xl'?priceXL(p):priceC(p);if(ci.half2){const q=prod(ci.half2);b=Math.max(b,ci.size==='xl'?priceXL(q):priceC(q))}return b+Object.entries(ci.sups||{}).reduce((a,[k,n])=>a+supPrice(k)*n,0)}return priceC(p)}
function lineName(ci){const p=prod(ci.pid);if(ci.half2)return'Bi-goût '+p.n+' / '+prod(ci.half2).n;return p.n}
function lineDetails(ci){const p=prod(ci.pid);const out=[];
  if(p.kind==='pizza'){out.push(['size',ci.size==='xl'?'XL':'Classique']);if(ci.half2){out.push(['bi','½ '+p.n]);out.push(['bi','½ '+prod(ci.half2).n])}
    (ci.removed||[]).forEach(r=>out.push(['sans','SANS '+r.toLowerCase()]));Object.entries(ci.sups||{}).forEach(([k,n])=>n&&out.push(['sup','+ '+k+(n>1?' ×'+n:'')]))}
  (p.groups||[]).forEach((g,gi)=>{const v=(ci.picks||{})[gi];if(v&&v.length)out.push(['pick',g.l+' : '+v.join(', ')])});return out}
function sig(ci){return JSON.stringify([ci.pid,ci.size,ci.half2,[...(ci.removed||[])].sort(),ci.sups,ci.picks])}
function cartTotals(cart=S.cart,mode=S.mode,useReward=S.useReward){const sub=cart.reduce((a,c)=>a+unitPrice(c)*c.qty,0);let disc=0;
  if(useReward){const pz=cart.filter(c=>prod(c.pid).kind==='pizza');if(pz.length){const m=Math.min(...pz.map(c=>priceC(prod(c.pid))));disc=m}}
  const net=sub-disc;const fee=mode==='livraison'?(net>=S.delivery.free?0:S.delivery.fee):0;return{sub,disc,fee,total:net+fee,net,count:cart.reduce((a,c)=>a+c.qty,0)}}

function lastOwn(){return S.orders.filter(o=>o.own).sort((a,b)=>b.at-a.at)[0]}

function vMenu(st){const w=waits();const liv=S.mode==='livraison';const last=S.user.logged?lastOwn():null;const solo=prod('f-solo');
  const sub=liv?(S.delivery.on?`Livrée en ~${w.liv} min · minimum ${eur(S.delivery.min)} · frais ${eur(S.delivery.fee)}, offerts dès ${eur(S.delivery.free)}`:'La livraison est désactivée pour le moment.'):`Prête en ~${w.prep} min · à récupérer au 121 rue Nationale`;
  return`<div class="mode-row"><div class="seg" role="group" aria-label="Mode de commande"><button class="${!liv?'on':''}" data-a="mode" data-v="emporter" aria-pressed="${!liv}">${ICON.bag} À emporter</button><button class="${liv?'on':''}" data-a="mode" data-v="livraison" aria-pressed="${liv}">${ICON.scooter} Livraison</button></div><p class="mode-sub">${sub}</p></div>
  <section class="hero"><div class="hero-txt"><span class="eyebrow">La plus commandée</span><h2>Formule<br>Solo</h2><p>1 pizza au choix, 1 dessert et 1 canette. ${liv?`Livrée en ~${w.liv} min.`:`Prête en ~${w.prep} min.`}</p><div class="hero-row"><span class="tag tag-lg num">${eur(priceC(solo))}</span><button class="btn btn-light btn-sm" data-a="open" data-id="f-solo" ${isOut(solo)?'disabled':''}>Je commande</button></div></div><div class="hero-art">${pizzaSVG(prod('orientale'))}</div></section>
  ${S.offer.shown&&S.offer.text?`<div class="offer">${ICON.gift}<span>${esc(S.offer.text)}</span></div>`:''}
  ${last?`<div class="last"><div><strong>Ta dernière commande · N°${last.num}</strong><span>${esc(last.items.map(i=>(i.qty>1?i.qty+'× ':'')+i.name).join(', '))}</span></div><button class="btn btn-dark btn-sm" data-a="reorder" data-id="${last.id}">Recommander</button></div>`:''}
  <div class="search"><span>${ICON.search}</span><label class="sr" for="c-search">Rechercher dans la carte</label><input id="c-search" data-in="q" type="search" placeholder="Une pizza, un ingrédient… (ex. chèvre)" value="${esc(U.q)}" autocomplete="off"></div>
  <div class="filters" role="group" aria-label="Filtres">${[['tomate','Base tomate'],['creme','Base crème'],['veg','Végétarienne']].map(([k,l])=>`<button class="chip ${U.filter===k?'on':''}" data-a="filter" data-v="${k}" aria-pressed="${U.filter===k}">${l}</button>`).join('')}</div>
  <div id="c-list">${menuList()}</div>`}
function matches(p){if(U.filter){if(p.kind!=='pizza')return false;if(U.filter==='veg'&&!p.veg)return false;if(U.filter==='tomate'&&p.base!=='tomate')return false;if(U.filter==='creme'&&p.base!=='creme')return false}
  if(U.q.trim()){const q=norm(U.q.trim());const hay=norm([p.n,p.d||'',p.kind==='pizza'?BASES[p.base]+' '+p.ing.join(' '):''].join(' '));return q.split(/\s+/).every(w=>hay.includes(w))}return true}
function menuList(){const items=P.filter(visible);
  if(U.q.trim()||U.filter){const r=items.filter(matches);if(!r.length)return`<div class="empty"><strong>Aucun produit trouvé</strong><span>Essaie un autre mot, par exemple « reblochon » ou « thon ».</span><button class="btn btn-dark btn-sm" data-a="clear-search">Effacer la recherche</button></div>`;
    return`<div class="sec"><p class="sec-note">${r.length} résultat${r.length>1?'s':''}</p>${r.map(pCard).join('')}</div>`}
  const favs=items.filter(p=>S.favs.includes(p.id));const cats=(favs.length?[['favs','Favoris']]:[]).concat(CATS);
  return`<nav class="cats" aria-label="Catégories">${cats.map(([k,l])=>`<button class="${k==='favs'?'cat-fav':''}" data-a="cat" data-v="${k}">${l}</button>`).join('')}</nav>`+
    (favs.length?`<section class="sec" id="sec-favs"><h2>Tes favoris</h2>${favs.map(pCard).join('')}</section>`:'')+
    CATS.map(([k,l])=>{const list=items.filter(p=>p.cat===k);if(!list.length)return'';const note=k==='tomate'?`<p class="sec-note">Toutes nos pizzas existent en Classique et en XL, et peuvent être bi-goût. ${tbc('Prix XL à confirmer')}</p>`:'';return`<section class="sec" id="sec-${k}"><h2>${l}</h2>${note}${list.map(pCard).join('')}</section>`}).join('')}
function desc(p){return p.kind==='pizza'?BASES[p.base]+', '+p.ing.join(', ').toLowerCase():p.d}
function pCard(p){const so=isOut(p),fav=S.favs.includes(p.id);
  return`<article class="pcard ${so?'is-out':''}"><button class="pvis" data-a="open" data-id="${p.id}" aria-label="Voir ${esc(p.n)}">${visual(p)}${so?'<span class="out-badge">ÉPUISÉ</span>':''}</button>
  <div class="pbody"><div class="prow"><h3 data-a="open" data-id="${p.id}">${esc(p.n)}${p.hot?` <span class="hot">${esc(p.hot)}</span>`:''}</h3><button class="fav ${fav?'on':''}" data-a="fav" data-id="${p.id}" aria-label="${fav?'Retirer des':'Ajouter aux'} favoris" aria-pressed="${fav}">${ICON.heart}</button></div>
  <p class="pdesc">${esc(desc(p))}</p>
  <div class="pfoot"><span class="tag num">${p.kind==='pizza'?'dès ':''}${eur(priceC(p))}</span><button class="link-sm" data-a="alg" data-id="${p.id}">Allergènes</button>${tbc(p.tbc)}<button class="plus" data-a="quick" data-id="${p.id}" ${so?'disabled':''} aria-label="Ajouter ${esc(p.n)}">+</button></div></div></article>`}

/* ----- Composer ----- */
function needsSheet(p){return p.kind==='pizza'||!!p.groups}
function groupOpts(g){return g.k==='pizza'?PIZZAS.filter(p=>visible(p)&&!isOut(p)).map(p=>p.n):g.o}
function missingCount(sh){const p=prod(sh.pid);let m=0;(p.groups||[]).forEach((g,gi)=>{m+=Math.max(0,g.n-((sh.picks[gi]||[]).length))});if(p.kind==='pizza'&&sh.bi&&!sh.half2)m++;return m}
function sheetItem(sh){return{pid:sh.pid,qty:sh.qty,size:sh.size,half2:sh.bi?sh.half2:null,removed:sh.removed,sups:Object.fromEntries(Object.entries(sh.sups).filter(([k,n])=>n>0)),picks:sh.picks}}
function vCompose(){const sh=U.sheet;const p=prod(sh.pid);const ci=sheetItem(sh);const unit=unitPrice(ci);const miss=missingCount(sh);
  let body=`<div class="comp-vis">${visual(p,sh.bi?sh.half2:null)}</div><div class="comp-head"><h2>${esc(sh.bi&&sh.half2?'Bi-goût':p.n)}</h2>${sh.bi&&sh.half2?`<p class="ings"><b>${esc(p.n)}</b> / <b>${esc(prod(sh.half2).n)}</b></p>`:''}<p class="ings">${esc(desc(p))}</p><div class="pfoot"><span class="tag num">${eur(unit)}</span><button class="link-sm" data-a="alg" data-id="${p.id}" data-h="${sh.bi&&sh.half2?sh.half2:''}">Voir les allergènes</button>${tbc(p.tbc)}</div></div>`;
  if(p.kind==='pizza'){
    body+=`<div class="grp"><div class="grp-h"><h4>Taille</h4><span class="pill ok">OK</span>${tbc('Prix XL à confirmer')}</div><div class="size-btns"><button class="${sh.size==='c'?'on':''}" data-a="size" data-v="c" aria-pressed="${sh.size==='c'}"><b>Classique</b><span class="num">${eur(priceC(p))}</span></button><button class="${sh.size==='xl'?'on':''}" data-a="size" data-v="xl" aria-pressed="${sh.size==='xl'}"><b>XL</b><span class="num">${eur(priceXL(p))}</span></button></div></div>`;
    body+=`<div class="grp"><div class="toggle-row"><div><b>Faire une pizza bi-goût</b><small>Moitié ${esc(p.n)}, moitié une autre recette. Prix de la plus chère des deux.</small></div><button class="switch ${sh.bi?'on':''}" data-a="bi" role="switch" aria-checked="${sh.bi}" aria-label="Pizza bi-goût"></button></div>
    ${sh.bi?`<label class="sr" for="half2">Deuxième moitié</label><select class="sel" id="half2" data-ch="half2"><option value="">Choisis la 2e moitié…</option>${PIZZAS.filter(q=>q.id!==p.id&&visible(q)&&!isOut(q)).map(q=>`<option value="${q.id}" ${sh.half2===q.id?'selected':''}>${esc(q.n)}</option>`).join('')}</select>`:''}</div>`;
    body+=`<div class="grp"><div class="grp-h"><h4>Ingrédients</h4><span class="hint">Touche pour retirer</span></div><div class="chips"><span class="chip on" aria-disabled="true">${BASES[p.base]}</span>${p.ing.map(i=>{const r=sh.removed.includes(i);return`<button class="chip ${r?'removed':''}" data-a="rm" data-v="${esc(i)}" aria-pressed="${!r}">${esc(i)}</button>`}).join('')}</div>${sh.bi?'<p class="hint">Les retraits s\'appliquent à la 1re moitié.</p>':''}</div>`;
    body+=`<div class="grp"><div class="grp-h"><h4>Suppléments</h4>${tbc('Liste et prix à confirmer')}</div><div class="sup-list">${SUPS.filter(([n])=>!S.soldI.includes(n)).map(([n,pr])=>{const q=sh.sups[n]||0;return`<div class="sup"><span>${esc(n)}</span><em class="num">+${eur(pr)}</em><div class="stepper"><button data-a="sup-" data-v="${esc(n)}" aria-label="Retirer un supplément ${esc(n)}" ${q?'':'disabled'}>−</button><output class="num">${q}</output><button data-a="sup+" data-v="${esc(n)}" aria-label="Ajouter un supplément ${esc(n)}" ${q>=2?'disabled':''}>+</button></div></div>`}).join('')}</div></div>`}
  (p.groups||[]).forEach((g,gi)=>{const v=sh.picks[gi]||[];const ok=v.length>=g.n;
    body+=`<div class="grp"><div class="grp-h"><h4>${esc(g.l)}</h4><span class="pill ${ok?'ok':''}">${ok?'OK':'Choisis '+g.n}</span></div><div class="chips">${groupOpts(g).map(o=>{const on=v.includes(o);return`<button class="chip ${on?'on':''}" data-a="pick" data-g="${gi}" data-v="${esc(o)}" aria-pressed="${on}">${esc(o)}</button>`}).join('')}</div>${g.k==='pizza'&&p.id==='f-family'?'<p class="hint">Pizzas en taille XL.</p>':''}</div>`});
  body+=`<div class="qty-row"><span>Quantité</span><div class="stepper"><button data-a="qty-" aria-label="Moins" ${sh.qty<=1?'disabled':''}>−</button><output class="num">${sh.qty}</output><button data-a="qty+" aria-label="Plus">+</button></div></div>`;
  return`<div class="sheet-wrap" data-a="close-sheet" data-self="1"><div class="sheet ${U._anim?'anim':''}" role="dialog" aria-modal="true" aria-label="${esc(p.n)}"><div class="sheet-top"><h3>${esc(p.n)}</h3><button class="icon-btn" data-a="close-sheet" aria-label="Fermer">${ICON.close}</button></div><div class="sheet-body">${body}</div><div class="sheet-foot">${miss?`<p class="miss">Encore ${miss} choix à faire</p>`:''}<button class="btn btn-red btn-block" data-a="add" ${miss?'disabled':''}>Ajouter · <span class="num">${eur(unit*sh.qty)}</span></button></div></div></div>`}

/* ----- Panier ----- */
function vCart(st){const t=cartTotals();const liv=S.mode==='livraison';const w=waits();const can=canOrder(st,S.mode);
  if(!S.cart.length)return sheetFrame('Ton panier',`<div class="empty"><strong>Panier vide</strong><span>Choisis une pizza pour commencer.</span><button class="btn btn-red btn-sm" data-a="close-sheet">Voir la carte</button></div>`,'');
  const inCart=new Set(S.cart.map(c=>c.pid));const sugg=['potatoes','mozza','t-daim','coca15','ms-vc','wings'].filter(id=>!inCart.has(id)&&!isOut(prod(id))).slice(0,4);
  const canReward=S.user.logged&&S.user.stamps>=S.loyalty.need;const hasPizza=S.cart.some(c=>prod(c.pid).kind==='pizza');
  const minLeft=liv?Math.max(0,S.delivery.min-t.net):0;
  let html=S.cart.map(c=>{const p=prod(c.pid);return`<div class="cline"><div class="pvis">${visual(p,c.half2)}</div><div><h4>${esc(lineName(c))}</h4><ul>${lineDetails(c).map(([k,v])=>`<li class="${k==='sans'?'l-sans':k==='sup'?'l-sup':''}">${esc(v)}</li>`).join('')}</ul></div><div class="right"><b class="num">${eur(unitPrice(c)*c.qty)}</b><div class="stepper"><button data-a="ci-" data-k="${c.key}" aria-label="Retirer un">−</button><output class="num">${c.qty}</output><button data-a="ci+" data-k="${c.key}" aria-label="Ajouter un">+</button></div></div></div>`}).join('');
  if(sugg.length)html+=`<div class="grp"><div class="grp-h"><h4>Un petit plus ?</h4></div><div class="sugg">${sugg.map(id=>{const p=prod(id);return`<button data-a="quick" data-id="${id}"><span class="pvis">${visual(p)}</span>${esc(p.n)}<em class="num">+ ${eur(priceC(p))}</em></button>`}).join('')}</div></div>`;
  html+=`<div class="grp"><div class="grp-h"><h4>Une précision pour la cuisine ?</h4></div><label class="sr" for="c-note">Note pour la cuisine</label><textarea class="note" id="c-note" data-in="note" placeholder="Bien cuite, coupée en 8, sauce à part…">${esc(S.note)}</textarea></div>`;
  if(canReward)html+=`<div class="reward">${ICON.gift}<div><b>Ta pizza classique offerte est prête</b><small>${S.useReward?(hasPizza?'Appliquée sur ta pizza la moins chère.':'Ajoute une pizza pour en profiter.'):`Tu as ${S.user.stamps} tampons.`}</small></div><button class="btn btn-sm ${S.useReward?'btn-light':'btn-cheese'}" data-a="reward">${S.useReward?'Retirer':'Utiliser'}</button></div>`;
  html+=`<div class="card"><div class="seg"><button class="${!liv?'on':''}" data-a="mode" data-v="emporter">${ICON.bag} À emporter</button><button class="${liv?'on':''}" data-a="mode" data-v="livraison">${ICON.scooter} Livraison</button></div><p class="hint">${liv?`Livrée en ~${w.liv} min`:`Retrait au comptoir · prête en ~${w.prep} min`}</p>
  ${liv&&minLeft>0?`<div><p class="hint" style="margin-bottom:6px">Plus que <b class="num">${eur(minLeft)}</b> pour atteindre le minimum de livraison (${eur(S.delivery.min)}).</p><div class="progress"><i style="width:${Math.min(100,t.net/S.delivery.min*100)}%"></i></div></div>`:''}
  <div class="totals"><div><span>Sous-total</span><span class="num">${eur(t.sub)}</span></div>${t.disc?`<div style="color:var(--basil)"><span>Pizza offerte (fidélité)</span><span class="num">− ${eur(t.disc)}</span></div>`:''}${liv?`<div><span>Frais de livraison</span><span class="num">${t.fee?eur(t.fee):'Offerts'}</span></div>`:''}<div class="grand"><span>Total</span><span class="num">${eur(t.total)}</span></div></div></div>`;
  const block=!can.ok?can.why:(liv&&minLeft>0)?`Minimum de livraison : ${eur(S.delivery.min)}.`:'';
  const foot=`${block?`<p class="miss">${esc(block)}</p>`:''}<button class="btn btn-red btn-block" data-a="checkout" ${block?'disabled':''}>Commander · <span class="num">${eur(t.total)}</span></button>`;
  return sheetFrame('Ton panier',html,foot)}
function sheetFrame(title,body,foot,cls=''){return`<div class="sheet-wrap" data-a="close-sheet" data-self="1"><div class="sheet ${cls} ${U._anim?'anim':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-top"><h3>${esc(title)}</h3><button class="icon-btn" data-a="close-sheet" aria-label="Fermer">${ICON.close}</button></div><div class="sheet-body">${body}</div>${foot?`<div class="sheet-foot">${foot}</div>`:''}</div></div>`}

/* ----- Tes infos et paiement ----- */
function initForm(){const u=S.user;const a=u.addrs[0]||{};U.form={acct:u.logged?'logged':'guest',fn:u.logged?u.fn:'',ln:u.logged?u.ln:'',tel:u.logged?u.tel:'',email:'',pw:'',street:a.street||'',commune:a.commune||'Villefranche-sur-Saône',comp:a.comp||'',instr:'',when:'asap',pay:'online',method:'especes',change:'',optin:false,errors:null}}
function slotOptions(st){const w=waits();const first=st.t+(S.mode==='livraison'?w.liv:w.prep)*60000;const out=[];if(!st.slot)return out;let t=Math.ceil(first/900000)*900000+900000;while(t<=st.slot.end-15*60000&&out.length<24){out.push(hm(t));t+=900000}return out}
const COMMUNES=['Villefranche-sur-Saône','Gleizé','Limas','Arnas','Jassans-Riottier','Anse','Belleville-en-Beaujolais','Autre commune'];
function vCheckout(st){const f=U.form;const t=cartTotals();const liv=S.mode==='livraison';const w=waits();const zoneOk=S.delivery.communes.includes(f.commune);
  const fld=(k,l,type='text',ph='',x='')=>`<div class="field"><label for="f-${k}">${l}</label><input id="f-${k}" type="${type}" data-in="f:${k}" value="${esc(f[k])}" placeholder="${esc(ph)}" ${x}></div>`;
  let h=`<div class="screen-top"><button class="icon-btn" data-a="back" aria-label="Retour au panier">${ICON.back}</button><h2>Tes infos</h2></div><div class="form">`;
  h+=`<div class="fsec"><p class="hint">Pour qu'on t'appelle si besoin et qu'on te reconnaisse ${liv?'à la porte':'au comptoir'}.</p>`;
  if(f.acct==='logged')h+=`<div class="ok-box">Connecté en tant que ${esc(S.user.fn)} ${esc(S.user.ln)} · ${t.total>=S.loyalty.min?'Cette commande te rapporte 1 tampon.':`Minimum ${eur(S.loyalty.min)} pour gagner un tampon.`}</div><button class="link-sm" data-a="acct" data-v="guest" style="justify-self:start">Ce n'est pas moi</button>`;
  else h+=`<div class="seg"><button class="${f.acct==='guest'?'on':''}" data-a="acct" data-v="guest">Invité</button><button class="${f.acct==='create'?'on':''}" data-a="acct" data-v="create">Créer un compte</button></div><p class="hint">${f.acct==='guest'?'En invité, tu ne gagnes pas de tampon fidélité.':'Avec un compte, chaque commande te rapporte 1 tampon.'} <button class="link-sm" data-a="login-demo">Déjà un compte ? Se connecter</button></p>`;
  h+=`<div class="row2">${fld('fn','Prénom','text','Amin','autocomplete="given-name"')}${fld('ln','Nom','text','Bensaïd','autocomplete="family-name"')}</div>${fld('tel','Téléphone (10 chiffres)','tel','06 12 34 56 78','autocomplete="tel" inputmode="tel"')}`;
  if(f.acct==='create')h+=`${fld('email','E-mail','email','toi@exemple.fr','autocomplete="email"')}${fld('pw','Mot de passe (6 caractères minimum)','password','','autocomplete="new-password"')}`;
  h+=`</div>`;
  if(liv){h+=`<div class="fsec"><h3>Adresse de livraison</h3>${S.user.logged&&S.user.addrs.length&&f.acct==='logged'?`<div class="chips">${S.user.addrs.map((a,i)=>`<button class="chip ${f.street===a.street?'on':''}" data-a="use-addr" data-v="${i}">${esc(a.label)}</button>`).join('')}</div>`:''}
    ${fld('street','Numéro et rue','text','48 rue de la Paix','autocomplete="street-address"')}
    <div class="field"><label for="f-commune">Commune</label><select id="f-commune" data-ch="commune">${COMMUNES.map(c=>`<option ${f.commune===c?'selected':''}>${c}</option>`).join('')}</select></div>
    ${zoneOk?`<p class="hint">On livre à ${esc(f.commune)} · ~${w.liv} min. ${tbc('Zone à confirmer')}</p>`:`<div class="warn-box">Désolé, on ne livre pas encore à cette adresse. <button class="link-sm" data-a="mode" data-v="emporter" style="color:inherit">Passer en À emporter</button></div>`}
    ${fld('comp','Complément (bâtiment, étage, digicode, interphone)','text','Bât. B, 3e étage, code 2580')}
    <div class="field"><label for="f-instr">Instructions pour le livreur</label><textarea id="f-instr" data-in="f:instr" placeholder="Sonner à « Bensaïd », laisser devant la porte…">${esc(f.instr)}</textarea></div></div>`}
  const slots=slotOptions(st);
  h+=`<div class="fsec"><h3>${liv?'Quand veux-tu être livré ?':'Quand veux-tu la récupérer ?'}</h3><div class="field"><label for="f-when">Heure</label><select id="f-when" data-ch="when"><option value="asap" ${f.when==='asap'?'selected':''}>Dès que possible (~${liv?w.liv:w.prep} min)</option>${slots.map(s=>`<option ${f.when===s?'selected':''}>${s}</option>`).join('')}</select></div><p class="hint">Créneaux de 15 min jusqu'à ${st.slot?hm(st.slot.end):'la fermeture'}.</p></div>`;
  h+=`<div class="fsec"><h3>Paiement</h3><div class="radio-list"><button class="radio ${f.pay==='online'?'on':''}" data-a="pay" data-v="online"><i></i><div><b>Payer en ligne</b><small>Carte bancaire, Apple Pay, Google Pay</small></div></button>`;
  if(S.payPlace.on){h+=`<button class="radio ${f.pay==='place'?'on':''}" data-a="pay" data-v="place" ${t.total>S.payPlace.cap?'disabled':''}><i></i><div><b>${liv?'Payer au livreur':'Payer au comptoir'}</b><small>${t.total>S.payPlace.cap?`Possible jusqu'à ${eur(S.payPlace.cap)}`:'Espèces, carte ou titre-restaurant'} ${tbc('Option à confirmer')}</small></div></button>`}
  h+=`</div>`;
  if(f.pay==='place')h+=`<div class="chips">${[['especes','Espèces'],['carte','Carte'],['titre','Titre-restaurant']].map(([k,l])=>`<button class="chip ${f.method===k?'on':''}" data-a="method" data-v="${k}">${l}</button>`).join('')}</div>${f.method==='especes'?fld('change','Sur combien ? (pour préparer ta monnaie)','number','50','inputmode="decimal"'):''}`;
  h+=`</div><div class="card"><h3>Récapitulatif</h3>${S.cart.map(c=>`<div class="totals"><div><span>${c.qty}× ${esc(lineName(c))}${prod(c.pid).kind==='pizza'?' · '+(c.size==='xl'?'XL':'Classique'):''}</span><span class="num">${eur(unitPrice(c)*c.qty)}</span></div></div>`).join('')}<div class="totals">${t.disc?`<div style="color:var(--basil)"><span>Pizza offerte</span><span class="num">− ${eur(t.disc)}</span></div>`:''}${liv?`<div><span>Livraison</span><span class="num">${t.fee?eur(t.fee):'Offerte'}</span></div>`:''}<div class="grand"><span>Total</span><span class="num">${eur(t.total)}</span></div></div></div>`;
  h+=`<label class="check"><input type="checkbox" id="f-optin" data-ch="optin" ${f.optin?'checked':''}> <span>Je veux recevoir les offres de Full Pizza par SMS ou e-mail (facultatif).</span></label>`;

function validate(){const f=U.form;const miss=[];if(!f.fn.trim())miss.push('ton prénom');if(!f.ln.trim())miss.push('ton nom');if(f.tel.replace(/\D/g,'').length!==10)miss.push('un téléphone à 10 chiffres');

function placeOrder(paid){const st=store();const can=canOrder(st,S.mode);if(!can.ok){U.sheet=null;toast('ctoast',can.why);return}
  const bad=S.cart.find(c=>isOut(prod(c.pid))||(c.half2&&isOut(prod(c.half2))));if(bad){U.sheet=null;toast('ctoast',`${lineName(bad)} vient d'être épuisé. Retire-le du panier.`);return}
  const f=U.form;const t=cartTotals();const w=waits();ensureDay();
  let num=(S.counter[S.serviceDay]||0)+1;if(num>999)num=1;S.counter[S.serviceDay]=num;
  const items=S.cart.map(c=>({...c,unit:unitPrice(c),name:lineName(c),det:lineDetails(c),reward:false}));
  if(t.disc){const pz=items.filter(i=>prod(i.pid).kind==='pizza').sort((a,b)=>priceC(prod(a.pid))-priceC(prod(b.pid)))[0];if(pz)pz.reward=true}
  let promise;if(f.when==='asap')promise=st.t+(S.mode==='livraison'?w.liv:w.prep)*60000;else{const [h,m]=f.when.split(':').map(Number);const d=new Date(st.t);d.setHours(h,m,0,0);if(d.getTime()<st.t-3600000)d.setDate(d.getDate()+1);promise=d.getTime()}
  const logged=f.acct==='logged'||f.acct==='create';
  if(f.acct==='create'){S.user={...S.user,logged:true,fn:f.fn.trim(),ln:f.ln.trim(),tel:f.tel,email:f.email,stamps:0,history:[]}}
  const o={id:uid(),num,sday:S.serviceDay,at:st.t,mode:S.mode,client:{fn:f.fn.trim(),ln:f.ln.trim(),tel:f.tel.replace(/\D/g,'')},items,sub:t.sub,disc:t.disc,fee:t.fee,total:t.total,pay:paid?'online':'place',method:paid?'online':f.method,change:!paid&&f.method==='especes'&&f.change?Number(f.change):null,paid,status:'recue',note:S.note.trim(),own:true,user:logged,isNew:true,when:f.when,promise,by:null,driver:null,rating:0,stamped:false,
    addr:S.mode==='livraison'?{street:f.street.trim(),commune:f.commune,comp:f.comp.trim(),instr:f.instr.trim()}:null,log:{}};
  if(t.disc){S.user.stamps-=S.loyalty.need;S.user.history.unshift({t:new Date(st.t).toISOString().slice(0,10),l:'Pizza offerte · N°'+num,v:-S.loyalty.need})}
  if(paid&&logged&&o.total>=S.loyalty.min){S.user.stamps++;o.stamped=true;S.user.history.unshift({t:new Date(st.t).toISOString().slice(0,10),l:'Commande N°'+num,v:1})}
  S.orders.push(o);S.cart=[];S.note='';S.useReward=false;U.sheet=null;U.screen='track';U.trackId=o.id;U.thanks[o.id]=true;beep();renderAll()}

function stepsFor(o){return o.mode==='livraison'?[['recue','Reçue'],['prep','En préparation'],['four','Au four'],['route','En livraison'],['livree','Livrée']]:[['recue','Reçue'],['prep','En préparation'],['four','Au four'],['prete','Prête'],['recuperee','Récupérée']]}

  case'size':U.sheet.size=d.v;break;
  case'bi':U.sheet.bi=!U.sheet.bi;if(!U.sheet.bi)U.sheet.half2=null;break;
  case'rm':{const r=U.sheet.removed;const i=r.indexOf(d.v);if(i>=0)r.splice(i,1);else r.push(d.v);break}
  case'sup+':U.sheet.sups[d.v]=(U.sheet.sups[d.v]||0)+1;break;
  case'sup-':U.sheet.sups[d.v]=Math.max(0,(U.sheet.sups[d.v]||0)-1);break;
  case'pick':{const g=prod(U.sheet.pid).groups[+d.g];const v=U.sheet.picks[d.g]||(U.sheet.picks[d.g]=[]);const i=v.indexOf(d.v);if(i>=0)v.splice(i,1);else{if(g.n===1)v.length=0;else if(v.length>=g.n)v.shift();v.push(d.v)}break}
  case'qty+':U.sheet.qty++;break;
  case'qty-':U.sheet.qty=Math.max(1,U.sheet.qty-1);break;
  case'add':{if(missingCount(U.sheet))return;const ci=sheetItem(U.sheet);addToCart(ci);const n=lineName(ci);U.sheet=null;U.ctoast=n+' ajouté au panier';clearTimeout(U.ctoastT);U.ctoastT=setTimeout(()=>{U.ctoast=null;renderClient()},2200);break}
  case'cart':U.sheet={type:'cart'};break;
  case'ci+':S.cart.find(c=>c.key===d.k).qty++;break;
  case'ci-':{const c=S.cart.find(x=>x.key===d.k);c.qty--;if(c.qty<=0)S.cart=S.cart.filter(x=>x!==c);break}
  case'reward':S.useReward=!S.useReward;break;
  case'loy-use':S.useReward=true;U.ctab='menu';U.sheet={type:'cart'};break;
  case'checkout':initForm();U.sheet=null;U.screen='checkout';break;
  case'back':U.screen=null;U.sheet={type:'cart'};break;
  case'acct':if(d.v==='guest'&&U.form.acct==='logged'){U.form={...U.form,acct:'guest',fn:'',ln:'',tel:''}}else U.form.acct=d.v;U.form.errors=null;break;
  case'login-demo':S.user={...defaults().user,stamps:Math.max(S.user.stamps,0)||7,history:S.user.history.length?S.user.history:defaults().user.history,logged:true};if(U.screen==='checkout')initForm();break;
  case'logout':S.user.logged=false;S.useReward=false;break;
  case'use-addr':{const ad=S.user.addrs[+d.v];Object.assign(U.form,{street:ad.street,commune:ad.commune,comp:ad.comp});break}
  case'pay':U.form.pay=d.v;break;
  case'method':U.form.method=d.v;break;
  case'submit':{const err=validate();U.form.errors=err;if(err)break;const can=canOrder(store(),S.mode);if(!can.ok){U.form.errors=can.why;break}if(U.form.pay==='online')U.sheet={type:'stripe',busy:false};else placeOrder(false);break}
  case'stripe-pay':U.sheet.busy=true;renderClient();setTimeout(()=>placeOrder(true),900);return;
  case'track':U.trackId=d.id;U.screen='track';break;
  case'rate':{const o=S.orders.find(x=>x.id===d.id);o.rating=+d.v;break}
  case'reorder':{const o=S.orders.find(x=>x.id===d.id);let skip=0;o.items.forEach(i=>{const p=prod(i.pid);if(isOut(p)||!visible(p)||(i.half2&&isOut(prod(i.half2)))){skip++;return}addToCart({pid:i.pid,qty:i.qty,size:i.size,half2:i.half2,removed:[...(i.removed||[])],sups:{...(i.sups||{})},picks:JSON.parse(JSON.stringify(i.picks||{}))})});U.screen=null;U.sheet={type:'cart'};if(skip){U.ctoast=skip+' produit'+(skip>1?'s':'')+' épuisé'+(skip>1?'s':'')+' non ajouté'+(skip>1?'s':'');setTimeout(()=>{U.ctoast=null;renderClient()},2600)}break}
  case'guest-signup':{const o=S.orders.find(x=>x.id===d.id);S.user={...S.user,logged:true,fn:o.client.fn,ln:o.client.ln,tel:o.client.tel,stamps:0,history:[]};o.user=true;if(o.total>=S.loyalty.min){addStamp('Commande N°'+o.num);o.stamped=true}break}
  case'legal':U.cmodal={type:'legal',v:d.v};break;
  case'copy':{const v=d.v;try{navigator.clipboard.writeText(v).then(()=>toast('ctoast','Numéro copié'),()=>toast('ctoast','Sélectionne le numéro pour le copier'))}catch(e){toast('ctoast','Sélectionne le numéro pour le copier')}return}
  /* patron */
  case'key':{if(U.pinLock>Date.now())return;U.pinErr=false;U.pinShake=false;if(U.pin.length<4)U.pin+=d.v;if(U.pin.length===4){const s=S.staff.find(x=>x.code===U.pin);if(s){U.staff=s.id;U.pin='';U.pinFails=0;U.ptab=ROLE[s.role].tabs[0][0];U.lastAct=Date.now()}else{U.pinFails++;U.pin='';U.pinErr=true;U.pinShake=true;if(U.pinFails>=5){U.pinLock=Date.now()+30000;U.pinFails=0;setTimeout(renderPatron,30500)}}}break}
  case'key-del':U.pin=U.pin.slice(0,-1);U.pinErr=false;break;
  case'quit':U.staff=null;U.pmodal=null;U.pin='';break;
  case'ptab':U.ptab=d.v;break;
  case'sound':U.sound=true;beep();break;
  case'pmode':U.pmode=d.v;break;
  case'pstat':U.pstat=d.v;break;
  case'seen':S.orders.find(x=>x.id===d.id).isNew=false;break;
  case'adv':{const o=S.orders.find(x=>x.id===d.id);o.status=d.v;o.isNew=false;o.log[d.v]=now();if(d.v==='prete'){o.by=me().fn}break}
  case'assign':{const o=S.orders.find(x=>x.id===d.id);const sel=$('#drv-'+d.id);o.driver=sel?sel.value:null;o.isNew=false;toast('ptoast',`N°${o.num} confiée à ${staffName(o.driver)}`);return}
  case'unassign':S.orders.find(x=>x.id===d.id).driver=null;break;
  case'encaisse':{const o=S.orders.find(x=>x.id===d.id);const sel=$('#enc-'+d.id);o.method=sel?sel.value:o.method;o.paid=true;o.isNew=false;if(o.user&&!o.stamped&&o.total>=S.loyalty.min){addStamp('Commande N°'+o.num);o.stamped=true}toast('ptoast',`N°${o.num} encaissée · ${methodLbl[o.method]}`);return}
  case'depart':{const o=S.orders.find(x=>x.id===d.id);o.status='route';o.log.route=now();o.alert=false;break}
  case'deliver':{const o=S.orders.find(x=>x.id===d.id);if(!o.paid){const sel=$('#enc-'+d.id);o.method=sel?sel.value:o.method;o.paid=true;if(o.user&&!o.stamped&&o.total>=S.loyalty.min){addStamp('Commande N°'+o.num);o.stamped=true}}o.status='livree';o.log.delivered=now();toast('ptoast',`N°${o.num} livrée`);return}
  case'unreach':{const o=S.orders.find(x=>x.id===d.id);o.alert=true;toast('ptoast','Le comptoir est prévenu : client injoignable');return}
  case'ticket':U.pmodal={type:'ticket',id:d.id,v:d.v};break;
  case'reprint':U.pmodal=null;toast('ptoast','Ticket envoyé à l’imprimante (démo)');return;
  case'refund':U.pmodal={type:'refund',id:d.id};break;
  case'refund-ok':{const o=S.orders.find(x=>x.id===d.id);o.status='remb';o.isNew=false;if(o.stamped){S.user.stamps=Math.max(0,S.user.stamps-1);S.user.history.unshift({t:new Date(now()).toISOString().slice(0,10),l:'Remboursement N°'+o.num,v:-1});o.stamped=false}U.pmodal=null;toast('ptoast',`N°${o.num} remboursée · ${eur(o.total)}`);return}
  case'cancel':U.pmodal={type:'cancel',id:d.id};break;
  case'cancel-ok':{const o=S.orders.find(x=>x.id===d.id);o.status='annulee';o.isNew=false;U.pmodal=null;break}
  case'close-pmodal':U.pmodal=null;break;
  case'scan':U.pmodal={type:'scan'};break;
  case'scan-ok':addStamp('Au comptoir');U.pmodal.done=true;break;
  case'pause':S.pause={until:now()+(+d.v)*60000,scope:d.s};break;
  case'resume':S.pause={until:0,scope:'all'};break;
  case'forced':S.forced=+d.v;break;
  case'soldp':{const i=S.soldP.indexOf(d.id);if(i>=0)S.soldP.splice(i,1);else{S.soldP.push(d.id);S.stockLog.push(prod(d.id).n)}break}
  case'soldi':{const i=S.soldI.indexOf(d.v);if(i>=0)S.soldI.splice(i,1);else{S.soldI.push(d.v);S.stockLog.push(d.v)}break}
  case'period':U.period=d.v;break;
  case'csv':U.pmodal={type:'csv'};break;
  case'copy-csv':{const ta=$('#csv-txt');try{navigator.clipboard.writeText(ta.value).then(()=>toast('ptoast','CSV copié'),()=>{ta.select();toast('ptoast','Texte sélectionné : fais Copier')})}catch(e){ta.select()}return}
  case'setb':{setPath(d.path,!getPath(d.path));break}
  case'commune-t':{const c=S.delivery.communes;const i=c.indexOf(d.v);if(i>=0)c.splice(i,1);else c.push(d.v);break}
  case'tm-add':{const n=$('#tm-name').value.trim();if(!n){toast('ptoast','Écris le prénom du salarié.');return}S.staff.push({id:uid(),fn:n,role:$('#tm-role').value,code:newCode()});toast('ptoast',`${n} ajouté · code ${S.staff[S.staff.length-1].code}`);return}
  case'tm-code':{const s=S.staff.find(x=>x.id===d.id);s.code=newCode();toast('ptoast',`Nouveau code pour ${s.fn} : ${s.code}`);return}
  case'tm-del':S.staff=S.staff.filter(x=>x.id!==d.id);break;
  default:return}
  renderAll()}
function newCode(){let c;do{c=String(Math.floor(1000+Math.random()*9000))}while(S.staff.some(s=>s.code===c));return c}
function getPath(p){return p.split('.').reduce((o,k)=>o[k],S)}
function setPath(p,v){const ks=p.split('.');const last=ks.pop();ks.reduce((o,k)=>o[k],S)[last]=v}

/* ---------- Écouteurs ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.dataset.self&&e.target!==t)return;if(t.closest('#tablet'))U.lastAct=Date.now();if(t.tagName==='A')return;e.preventDefault();act(t.dataset.a,t.dataset,t)});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;
  if(k==='q'){U.q=e.target.value;const l=$('#c-list');if(l)l.innerHTML=menuList();return}
  if(k==='note'){S.note=e.target.value;save();return}
  if(k.startsWith('f:')){U.form[k.slice(2)]=e.target.value}});
document.addEventListener('change',e=>{const t=e.target;const k=t.dataset.ch;if(!k)return;
  if(k==='half2'){U.sheet.half2=t.value||null;renderClient();return}
  if(k==='commune'){U.form.commune=t.value;renderClient();return}
  if(k==='when'){U.form.when=t.value;return}
  if(k==='optin'){U.form.optin=t.checked;return}
  if(k==='set'){let v=t.value;if(t.dataset.t==='num'){v=Math.max(0,parseFloat(String(v).replace(',','.'))||0)}setPath(t.dataset.path,v);renderAll();toast('ptoast','Réglage enregistré');return}
  if(k==='price'){const v=Math.max(0,parseFloat(t.value)||0);S.prices[t.dataset.id]={...(S.prices[t.dataset.id]||{}),[t.dataset.k]:v};renderAll();toast('ptoast','Prix mis à jour sur l’appli');return}
  if(k==='hide'){const id=t.dataset.id;S.hidden=t.checked?S.hidden.filter(x=>x!==id):[...S.hidden,id];renderAll();return}
  if(k==='promo'){S.promo[t.dataset.k]=t.checked;save();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(U.cmodal){U.cmodal=null;renderClient()}else if(U.sheet&&U.sheet.type!=='stripe'){U.sheet=null;renderClient()}else if(U.pmodal){U.pmodal=null;renderPatron()}}
  if(U.staff===null&&/^[0-9]$/.test(e.key)&&document.activeElement.closest&&!document.activeElement.closest('input,textarea,select')&&(U.view==='patron'||innerWidth>=1100)){act('key',{v:e.key})}});
setInterval(()=>{const ae=document.activeElement;if(ae&&ae.matches&&ae.matches('input,textarea,select'))return;
  if(U.staff&&me()&&me().role!=='livreur'&&Date.now()-U.lastAct>10*60000){U.staff=null;U.pmodal=null;U.ptoast='Déconnecté après 10 min sans activité';setTimeout(()=>{U.ptoast=null;renderPatron()},3000)}
  ensureDay();renderAll(false)},20000);
renderAll();
</script>
</body>
</html>
