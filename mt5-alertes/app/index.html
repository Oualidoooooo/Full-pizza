<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlertesPro</title>
<meta name="description" content="Les alertes de trading de ton robot MT5, calculées pour ton argent.">
<meta name="theme-color" content="#0a0e16">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AlertesPro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e16; --card:#121a29; --card2:#172134; --card3:#1d2940;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#e9eef7; --muted:#93a0b8; --dim:#66728a;
  --buy:#1fd197; --buy-bg:rgba(31,209,151,.13);
  --sell:#ff5a6e; --sell-bg:rgba(255,90,110,.13);
  --accent:#7b8cff; --accent2:#a77bff; --accent-bg:rgba(123,140,255,.14);
  --gold:#f5b94a; --gold-bg:rgba(245,185,74,.14);
  --blue:#4fb3ff; --blue-bg:rgba(79,179,255,.13);
  --radius:20px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(900px 500px at 85% -10%,rgba(123,140,255,.17),transparent 60%),
    radial-gradient(700px 420px at -10% 10%,rgba(167,123,255,.10),transparent 60%),var(--bg);
  background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:600px;margin:0 auto;padding:calc(12px + var(--safe-t)) 16px calc(100px + var(--safe-b))}
.app.solo{padding-bottom:calc(30px + var(--safe-b))}
.muted{color:var(--muted)} .dim{color:var(--dim)} .green{color:var(--buy)} .red{color:var(--sell)} .gold{color:var(--gold)}
.small{font-size:13px} .center{text-align:center}
.stack>*+*{margin-top:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(123,140,255,.35)}
.logo svg{width:22px;height:22px}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.chip.on{color:var(--text)} .chip.on .dot{background:var(--buy);animation:pulse 2s infinite}
.chip.off .dot{background:var(--sell)} .chip.demo .dot{background:var(--gold)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,209,151,.55)}70%{box-shadow:0 0 0 8px rgba(31,209,151,0)}100%{box-shadow:0 0 0 0 rgba(31,209,151,0)}}

.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px}
.sec h2{font-size:15px;font-weight:700}
.sec button{font-size:13px;color:var(--accent);font-weight:600}
.hello{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 2px 14px}
.hello small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:2px;letter-spacing:0}
.tone-red{background:linear-gradient(160deg,rgba(255,90,110,.16),var(--card) 70%);border-color:rgba(255,90,110,.35)}
.tone-gold{background:linear-gradient(160deg,rgba(245,185,74,.16),var(--card) 70%);border-color:rgba(245,185,74,.35)}
.tone-blue{background:linear-gradient(160deg,rgba(79,179,255,.16),var(--card) 70%);border-color:rgba(79,179,255,.35)}
.tone-violet{background:linear-gradient(160deg,rgba(123,140,255,.20),var(--card) 70%);border-color:rgba(123,140,255,.4)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:15px;
  font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 10px 26px rgba(123,140,255,.32);text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.tg{background:linear-gradient(135deg,#2aa9e8,#2381d9);box-shadow:0 10px 26px rgba(42,169,232,.3)}
.btn.green{background:linear-gradient(135deg,#1fd197,#16a878);box-shadow:0 10px 26px rgba(31,209,151,.25);color:#04261a}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line2);color:var(--text)}
.btn.line{background:none;box-shadow:none;border:1px solid var(--line2);color:var(--muted);font-weight:600;font-size:15px}
.btn.danger{background:none;box-shadow:none;border:1px solid rgba(255,90,110,.4);color:var(--sell);font-weight:600;font-size:15px}
.btn.small{padding:10px 14px;font-size:14px;border-radius:12px;width:auto}
.btn[disabled]{opacity:.55;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.link{color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

.welcome{padding:20px 4px 0;text-align:center}
.welcome .logo{width:72px;height:72px;border-radius:22px;margin:10px auto 18px}
.welcome .logo svg{width:40px;height:40px}
.welcome h1{font-size:32px;font-weight:800;letter-spacing:-.03em}
.welcome .lead{font-size:17px;color:var(--muted);margin:8px auto 22px;max-width:420px}
.feats{text-align:left;margin:0 0 22px}
.feat{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.feat+.feat{margin-top:10px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none}
.feat b{display:block;font-size:15.5px}
.feat span{color:var(--muted);font-size:14px}
.ic.gold{background:var(--gold-bg)} .ic.green{background:var(--buy-bg)} .ic.blue{background:var(--blue-bg)} .ic.red{background:var(--sell-bg)} .ic.grey{background:rgba(255,255,255,.07)}
.welcome .btn+.btn{margin-top:10px}
.note{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.5}
.warn{padding:12px 14px;border-radius:14px;background:var(--gold-bg);border:1px solid rgba(245,185,74,.35);color:#ffe2a6;font-size:14px;text-align:left}
.err{padding:12px 14px;border-radius:14px;background:var(--sell-bg);border:1px solid rgba(255,90,110,.35);color:#ffc2ca;font-size:14px}
.okmsg{padding:12px 14px;border-radius:14px;background:var(--buy-bg);border:1px solid rgba(31,209,151,.35);color:#b6f5df;font-size:14px}

.form-head{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px;display:grid;place-items:center;flex:none}
.form-head h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:14px;font-weight:600;margin:0 2px 6px}
.field>small{display:block;font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.inp{display:flex;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:14px;transition:border-color .15s}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(123,140,255,.18)}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;padding:14px;font-size:16px}
.inp .suf{padding:0 14px;color:var(--muted);font-weight:600}
.inp button{padding:0 14px;color:var(--muted);font-size:18px;align-self:stretch}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);margin:4px 2px 18px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}

.live{border-radius:22px;padding:16px;border:1px solid}
.live.buy{background:linear-gradient(160deg,rgba(31,209,151,.22),#11201d 55%,var(--card));border-color:rgba(31,209,151,.45)}
.live.sell{background:linear-gradient(160deg,rgba(255,90,110,.22),#22141a 55%,var(--card));border-color:rgba(255,90,110,.45)}
.live.pre{background:linear-gradient(160deg,rgba(245,185,74,.22),#221c11 55%,var(--card));border-color:rgba(245,185,74,.45)}
.live-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live-top .sym{font-size:22px;font-weight:800;letter-spacing:-.02em}
.side{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;letter-spacing:.02em}
.side.buy{background:var(--buy);color:#04261a} .side.sell{background:var(--sell);color:#2b0710} .side.pre{background:var(--gold);color:#2b1c02}
.timer{margin-left:auto;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tile{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;position:relative}
.tile small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tile b{display:block;font-family:var(--mono);font-size:19px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}
.tile.copy:after{content:"⧉";position:absolute;right:10px;top:9px;font-size:13px;color:var(--dim)}
.tile.sl b{color:#ff8b99} .tile.tp b{color:#5fe6b6}
.money2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.money2>div{border-radius:14px;padding:11px 12px}
.money2 .lose{background:var(--sell-bg);border:1px solid rgba(255,90,110,.3)}
.money2 .win{background:var(--buy-bg);border:1px solid rgba(31,209,151,.3)}
.money2 small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.money2 b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.money2 .lose b{color:var(--sell)} .money2 .win b{color:var(--buy)}
.howto{margin-top:12px;font-size:13.5px;color:var(--muted);background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px;line-height:1.55}
.howto b{color:var(--text)}
.skip{margin-top:12px;padding:12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px dashed rgba(255,90,110,.45);font-size:14px}

.big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{border-radius:14px;padding:12px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.kpi small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--dim)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--sell))}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.score>div{border-radius:14px;padding:12px 6px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.score b{display:block;font-size:24px;font-weight:800}
.score small{font-size:12.5px;color:var(--muted);font-weight:600}

.alert{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.alert+.alert{margin-top:10px}
.alert .ic{width:42px;height:42px;border-radius:13px;font-size:20px}
.alert .body{flex:1;min-width:0}
.alert .t1{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;flex-wrap:wrap}
.alert .t1 .when{margin-left:auto;font-size:12px;color:var(--dim);font-weight:500}
.alert .t2{font-size:13.5px;color:var(--muted);margin-top:3px}
.alert .t2 .num{color:var(--text)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.green{background:var(--buy-bg);color:var(--buy)} .pill.red{background:var(--sell-bg);color:var(--sell)}
.pill.gold{background:var(--gold-bg);color:var(--gold)} .pill.grey{background:rgba(255,255,255,.07);color:var(--muted)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.filters{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto}
.filters button{padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.filters button.on{background:var(--accent-bg);border-color:rgba(123,140,255,.5);color:var(--text)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:8px}

.mk{padding:15px}
.mk+.mk{margin-top:12px}
.mk-top{display:flex;align-items:center;gap:10px}
.mk-top .nm{flex:1;min-width:0}
.mk-top .nm b{font-size:17px;font-weight:800;display:block}
.mk-top .nm small{color:var(--muted);font-size:13px}
.trend{padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.trend.up{background:var(--buy-bg);color:var(--buy)} .trend.down{background:var(--sell-bg);color:var(--sell)} .trend.flat{background:rgba(255,255,255,.07);color:var(--muted)}
.tiles3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.tiles3>div{border-radius:13px;padding:10px 6px;text-align:center;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.tiles3 small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.tiles3 b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.tiles3 .l b{color:var(--sell)} .tiles3 .g b{color:var(--buy)}
.mk-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13.5px;color:var(--muted)}
.mk.off{opacity:.55}

.sw{position:relative;width:50px;height:30px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.14);transition:.2s}
.sw i:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--buy)}
.sw input:checked+i:before{transform:translateX(20px)}
.setting{display:flex;align-items:center;gap:14px;padding:4px 0}
.setting .txt{flex:1}
.setting .txt b{display:block;font-size:15px}
.setting .txt small{color:var(--muted);font-size:13px}

.range{width:100%;margin:14px 0 6px;accent-color:var(--accent);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin:0 2px}
.riskbox{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.riskbox b{white-space:nowrap}
.riskbox.ok{background:var(--buy-bg);border:1px solid rgba(31,209,151,.3)}
.riskbox.mid{background:var(--gold-bg);border:1px solid rgba(245,185,74,.3)}
.riskbox.high{background:var(--sell-bg);border:1px solid rgba(255,90,110,.3)}

.code{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.14em;text-align:center;padding:14px;border-radius:14px;
  background:rgba(0,0,0,.28);border:1px dashed var(--line2);margin:12px 0 4px;cursor:pointer;user-select:all}
.steps{counter-reset:s;margin:12px 0 4px}
.steps li{list-style:none;position:relative;padding-left:38px;margin-bottom:10px;font-size:14.5px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--accent-bg);color:var(--accent)}

.member{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0}
.member .av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--accent-bg);color:var(--accent);flex:none}
.member .who{flex:1;min-width:0}
.member .who b{display:block;font-size:14.5px}
.member .who small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member button{color:var(--sell);font-size:13px;font-weight:600;padding:6px}

details{border-top:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:0}
summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--muted);font-weight:700}
details[open] summary:after{content:"–"}
details p{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.55}
details b{color:var(--text)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(8px + var(--safe-b));
  background:rgba(10,14,22,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:14px;color:var(--dim);font-size:12px;font-weight:600}
.nav button .i{font-size:21px;line-height:1;filter:grayscale(1);opacity:.75}
.nav button.on{color:var(--text);background:var(--accent-bg)}
.nav button.on .i{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;
  background:#1f2a44;border:1px solid var(--line2);color:var(--text);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.4);transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.demo-band{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--gold-bg);border:1px solid rgba(245,185,74,.4);
  margin-bottom:14px;font-size:14px;color:#ffe2a6}
.demo-band button{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.legal{font-size:12px;color:var(--dim);text-align:center;margin-top:22px;line-height:1.5}
.legal a{color:var(--dim)}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ======================================================================
//  Adresse du serveur AlertesPro (Cloudflare). Vide tant qu'il n'est pas
//  installé : l'appli montre alors seulement l'exemple.
// ======================================================================
const DEFAULT_API = "";

const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l4.5-4.5 3.5 3.5 6-7"/><path d="M14 8h4v4"/></svg>';

const NF = {};
function fmt(v, d = 2) { const n = Number(v); if (!Number.isFinite(n)) return "–"; return (NF[d] || (NF[d] = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }))).format(n); }
function eur(v, sign = false, d = 2) {
  const n = Number(v) || 0;
  const s = sign ? (n > 0.004 ? "+" : n < -0.004 ? "−" : "") : (n < -0.004 ? "−" : "");
  return s + fmt(Math.abs(n), d) + " €";
}
const eur0 = (v) => eur(v, false, Number(v) % 1 ? 2 : 0);
const pct = (v) => fmt(v, 2).replace(/,00$/, "").replace(/(,\d)0$/, "$1") + "\u00a0%";
const lotTxt = (v) => (Number(v) || 0).toFixed(2);
function px(v, dg) { const n = Number(v); if (!Number.isFinite(n)) return "–"; return n.toFixed(Number.isFinite(+dg) ? +dg : 5); }
const nowS = () => Math.floor(Date.now() / 1000);
const hhmm = (ts) => new Date(ts * 1000).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
function when(ts) {
  const d = new Date(ts * 1000), t = new Date(), y = new Date(Date.now() - 86400000);
  if (d.toDateString() === t.toDateString()) return "aujourd'hui " + hhmm(ts);
  if (d.toDateString() === y.toDateString()) return "hier " + hhmm(ts);
  return d.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit" }) + " " + hhmm(ts);
}
function ago(ts) {
  const s = nowS() - ts;
  if (s < 90) return "à l'instant";
  if (s < 3600) return "il y a " + Math.round(s / 60) + " min";
  if (s < 86400) return "il y a " + Math.round(s / 3600) + " h";
  return "le " + when(ts);
}

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (x) {} ta.remove(); }
  toast("📋 " + (label || text) + " copié");
}
const leftTxt = (left) => (left > 0 ? "⏱ encore " + (left >= 120 ? Math.ceil(left / 60) + " min" : left + " s") : "⏱ terminé");

// ------------------------------------------------------------------ serveur
async function api(path, method = "GET", body) {
  if (!API) throw new Error("Le serveur n'est pas encore branché.");
  let r;
  try {
    r = await fetch(API + path, { method, headers: { "Content-Type": "application/json", ...(S.token ? { Authorization: "Bearer " + S.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { throw new Error("Pas de connexion au serveur. Vérifie ton internet."); }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && S.token && path !== "/api/me/delete") { logout(true); throw new Error(j.error || "Session expirée : reconnecte-toi."); }
  if (!r.ok || j.ok === false) throw new Error(j.error || "Erreur " + r.status);
  return j;
}
function setMe(j) { S.me = j; if (j.token) { S.token = j.token; LS.set("token", j.token); } }

async function refresh(all = true) {
  if (S.demo || !S.token) return;
  try {
    const jobs = [api("/api/me").then(setMe)];
    if (all) {
      jobs.push(api("/api/alerts?limit=80").then((j) => { S.alerts = j.alerts; }));
      jobs.push(api("/api/markets").then((j) => { S.markets = j; }));
    }
    await Promise.all(jobs);
    if (S.me && S.me.user.admin && (all || S.tab === "account")) S.admin = await api("/api/admin");
  } catch (e) { console.warn(e); }
  render(true);
}

let pollT = 0;
function startPolling() {
  clearInterval(pollT);
  pollT = setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 30000);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.token && !S.demo) refresh(); });
setInterval(() => document.querySelectorAll("[data-left]").forEach((el) => { el.textContent = leftTxt(+el.dataset.left - nowS()); }), 1000);

function logout(silent) {
  if (S.token && !silent && API) api("/api/logout", "POST").catch(() => {});
  S.token = null; LS.set("token", null); S.me = null; S.alerts = []; S.markets = null; S.admin = null; S.demo = false;
  clearInterval(pollT);
  go("welcome");
}

function go(view, tab) {

// ------------------------------------------------------------------ actions
function readForm(id) {
  const f = $("#" + id), o = {};
  if (f) f.querySelectorAll("input").forEach((i) => { o[i.name] = i.type === "checkbox" ? i.checked : i.value; });
  return o;
}

async function submit(kind) {
  const f = readForm(kind);
  Object.assign(S.form, f);
  S.error = ""; S.msg = "";
  try {
    if (kind === "signup") {
      if (!f.name.trim()) throw new Error("Écris ton prénom.");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) throw new Error("Vérifie ton adresse e-mail.");
      if (f.password.length < 8) throw new Error("Mot de passe trop court : 8 caractères minimum.");
      const cap = parseCap(f.capital);
      if (!(cap >= 50)) throw new Error("Indique ton capital (50 € minimum).");
      if (!f.ok) throw new Error("Coche la case pour confirmer que tu as compris les risques.");
      S.busy = true; render();
      const j = await api("/api/signup", "POST", { name: f.name, email: f.email, password: f.password, capital: cap, invite: f.invite || LS.get("invite") || "" });
      LS.set("invite", null);
      return enter(j);
    }
    if (kind === "login") {
      S.busy = true; render();
      return enter(await api("/api/login", "POST", { email: f.email, password: f.password }));
    }
    if (kind === "forgot") {
      S.busy = true; render();
      if (S.forgotStep === 1) {
        const j = await api("/api/forgot", "POST", { email: f.email });
        S.forgotStep = 2; S.busy = false; S.msg = j.message || "Code envoyé.";
        return render();
      }
      return enter(await api("/api/reset", "POST", { email: S.form.email, code: f.code, password: f.password }));
    }
  } catch (e) { S.error = e.message; }
  S.busy = false; render();
}
async function enter(j) {
  setMe(j); S.busy = false; S.form = {}; S.demo = false; S.alerts = []; S.markets = null;
  go("main", "home"); startPolling(); await refresh();
}

async function act(name, el) {
  try {
    if (name === "demo") return startDemo();
    if (name === "exit-demo") { S.demo = false; S.me = null; S.alerts = []; S.markets = null; if (API) loadInfo(); return go(API ? "signup" : "welcome"); }
    if (name === "server") {
      const v = prompt("Adresse du serveur AlertesPro (donnée par Claude) :", API || "https://");
      if (v != null) { API = v.trim().replace(/\/+$/, ""); if (API === "https:" || API === "https://") API = ""; LS.set("api", API || null); S.info = null; render(); }
      return;
    }
    if (name === "forgot") { S.forgotStep = 1; Object.assign(S.form, readForm("login")); return go("forgot"); }
    if (name === "forgot-again") { S.forgotStep = 1; S.msg = ""; return render(); }
    if (name === "eye") { const i = document.getElementById(el.dataset.for); i.type = i.type === "password" ? "text" : "password"; return; }
    if (S.demo) { if (el.type === "checkbox") el.checked = !el.checked; return toast("👀 C'est l'exemple : crée ton compte pour de vrai"); }
    if (name === "tg-open") { setTimeout(() => refresh(false), 8000); setTimeout(() => refresh(false), 20000); return; }
    if (name === "check-tg") { await refresh(false); return toast(S.me.user.telegram.linked ? "✅ Telegram relié !" : "Pas encore relié : touche DÉMARRER dans Telegram"); }
    if (name === "resume") { setMe(await api("/api/me", "PUT", { paused: false })); toast("▶️ Signaux relancés"); return render(); }
    if (name === "pause") { setMe(await api("/api/me", "PUT", { paused: !el.checked })); toast(el.checked ? "🔔 Signaux activés" : "⏸️ Signaux en pause"); return render(); }
    if (name === "save") {
      S.busy = true; S.error = ""; S.msg = "";
      const body = { name: $("#f_name").value, capital: parseCap($("#f_capital").value), riskPct: +$("#f_risk").value };
      render();
      try {
        setMe(await api("/api/me", "PUT", body));
        S.form = {}; toast("✅ Enregistré");
        S.markets = await api("/api/markets");
      } catch (e) { S.error = e.message; }
      S.busy = false; return render();
    }
    if (name === "test") { await api("/api/me/test", "POST"); return toast("📨 Message envoyé sur ton Telegram"); }
    if (name === "relink") { if (!confirm("Délier ce Telegram et créer un nouveau code ?")) return; setMe(await api("/api/me/relink", "POST")); return render(); }
    if (name === "logout") return logout();
    if (name === "delete") {
      const p = prompt("Pour supprimer ton compte et tout ton historique, écris ton mot de passe :");
      if (!p) return;
      await api("/api/me/delete", "POST", { password: p });
      toast("Compte supprimé"); return logout(true);
    }
    if (name === "share") {
      const url = inviteUrl(S.admin.invite);
      const text = "Rejoins-moi sur AlertesPro : les signaux de trading de mon robot MT5, calculés pour ton argent, sur Telegram 📈";
      if (navigator.share) { try { await navigator.share({ title: "AlertesPro", text, url }); } catch (e) {} return; }
      return copy(text + "\n" + url, "Lien d'invitation");
    }
    if (name === "new-invite") { if (!confirm("Créer un nouveau lien ? L'ancien ne marchera plus.")) return; S.admin = await api("/api/admin/invite", "POST"); return render(); }
    if (name === "remove") {
      if (!confirm("Retirer " + el.dataset.name + " ? Son compte et son historique seront supprimés.")) return;
      S.admin = await api("/api/admin/remove", "POST", { id: +el.dataset.id }); toast(el.dataset.name + " a été retiré"); return render();
    }
  } catch (e) { S.busy = false; toast("⚠️ " + e.message); render(); }
}

async function toggleMarket(sym, on) {
  if (S.demo) { toast("👀 C'est l'exemple : crée ton compte pour de vrai"); return render(); }
  const all = S.markets.markets.map((m) => m.sym);
  let cur = S.me.user.markets === "*" ? all.slice() : S.me.user.markets.slice();
  cur = on ? [...new Set([...cur, sym])] : cur.filter((s) => s !== sym);
  if (!cur.length) { toast("Garde au moins un marché"); return render(); }
  const list = all.every((s) => cur.includes(s)) ? "*" : cur;
  try {
    setMe(await api("/api/me", "PUT", { markets: list }));
    S.markets.markets.forEach((m) => { m.followed = list === "*" || list.includes(m.sym); });
    toast(on ? "🔔 Alertes " + sym + " activées" : "🔕 Alertes " + sym + " coupées");
  } catch (e) { toast("⚠️ " + e.message); }
  render();
}

function bind() {
  document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", (e) => { e.preventDefault(); loadInfo(); go(b.dataset.go); }));
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
  document.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => { S.filter = b.dataset.filter; render(); }));
  document.querySelectorAll("[data-act]").forEach((b) => {
    b.addEventListener(b.tagName === "INPUT" ? "change" : "click", (e) => { if (b.tagName === "A" && b.dataset.act !== "tg-open") e.preventDefault(); act(b.dataset.act, b); });
  });
  document.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => { if (b.dataset.copy) copy(b.dataset.copy, b.dataset.label); }));
  document.querySelectorAll("[data-market]").forEach((b) => b.addEventListener("change", () => toggleMarket(b.dataset.market, b.checked)));
  ["signup", "login", "forgot"].forEach((id) => { const f = $("#" + id); if (f) f.addEventListener("submit", (e) => { e.preventDefault(); submit(id); }); });
  const r = $("#f_risk"), c = $("#f_capital");
  const upd = () => {
    S.form.risk = r.value; S.form.capital = c.value;
    $("#riskVal").textContent = pct(+r.value);
    $("#riskInfo").innerHTML = riskInfo(parseCap(c.value) || 0, +r.value, (S.me.robot && S.me.robot.rr) || 2);
  };
  if (r && c && S.view === "main") { r.addEventListener("input", upd); c.addEventListener("input", upd); }
  document.querySelectorAll("[data-left]").forEach((el) => { el.textContent = leftTxt(+el.dataset.left - nowS()); });
}

async function loadInfo() {
  if (!API || S.info) return;
  try { S.info = await api("/api/info"); if (S.view === "signup") render(); } catch (e) {}
}

// ------------------------------------------------------------------ démarrage
(async function start() {
  if (S.token && API) {
    S.view = "main"; render(); startPolling();
    await refresh();
    if (!S.me) { S.view = "welcome"; render(); }
  } else {
    if (LS.get("invite") && API) { S.view = "signup"; loadInfo(); }
    render();
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
